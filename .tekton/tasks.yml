apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  description: Remove previous workspace contents before fetching source.
  workspaces:
    - name: source
  steps:
    - name: remove-old-files
      image: alpine:3.20
      script: |
        #!/bin/sh
        set -eu
        find "$(workspaces.source.path)" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose
spec:
  description: Run the Python Nose unit test suite.
  workspaces:
    - name: source
  steps:
    - name: run-nose-tests
      image: python:3.12-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        pip install --disable-pip-version-check -r requirements-dev.txt
        python -m nose -v
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: flake8
spec:
  workspaces:
    - name: source
  steps:
    - name: lint
      image: python:3.12-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        pip install --disable-pip-version-check -r requirements-dev.txt
        python -m flake8 app.py tests
